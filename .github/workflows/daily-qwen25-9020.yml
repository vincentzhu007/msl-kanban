name: Daily Qwen2.5 Kirin9020

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Daily date YYYYMMDD (empty: today in Asia/Shanghai)'
        required: false
        type: string
      force:
        description: 'Re-evaluate an already archived build'
        default: false
        type: boolean
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: device-dog-kirin9020
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.DAILY_ENABLED == 'true')
    runs-on: [self-hosted, dog, msl-kanban, container]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate daily with repository recipe
        id: evaluate
        env:
          DAILY_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /.dockerenv
          args=(--config /config/daily.json)
          if [ -n "$DAILY_DATE" ]; then args+=(--date "$DAILY_DATE"); fi
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          python3 scripts/daily.py "${args[@]}"
      - name: Publish validated results and task status
        if: always() && steps.evaluate.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git add kanban/data
          if [ -d kanban/jobs ]; then git add kanban/jobs; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: daily Kirin9020 evaluation ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Write task summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          matches = list(Path('kanban/jobs').glob('*-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if matches:
                  state = json.loads(matches[0].read_text())
                  out.write(f"Daily status: **{state['status']}**, stage: **{state['stage']}**\n")
                  out.write('Full artifacts remain on dog. Git publication and Vercel deployment are separate stages.\n')
              else:
                  out.write('No task record was generated; inspect setup or configuration errors.\n')
          PY
