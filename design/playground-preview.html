.spec div{border-top:1px solid #edf1f3;padding-top:12px}.spec b{display:block;margin-top:6px;font-size:13px;word-break:break-all}.note{line-height:1.8;color:#6f8089;font-size:12px;margin-top:16px}.legend{display:flex;gap:16px;font-size:12px;color:#607887;margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}footer{padding:22px 0;color:#80909a;font-size:11px}.wide{margin-bottom:18px}#error{color:#b54242;white-space:pre-wrap}select{max-width:500px}.hide{display:none}@media(max-width:800px){header{align-items:start;gap:15px;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.spec{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:start;flex-direction:column}.value{font-size:26px}}

.page-nav{display:flex;gap:20px;margin-bottom:24px}.page-nav a,a{color:#147c79;text-decoration:none}.page-nav a:hover,a:hover{text-decoration:underline}.summary-table{min-width:1150px}.summary-table td{vertical-align:top;font-variant-numeric:tabular-nums}.summary-table small,#summary-jobs small{display:block;margin-top:7px;color:#637681;font-size:11px;line-height:1.6}.summary-table .config-cell{max-width:230px;line-height:1.7}.task-state{display:inline-block;border-radius:5px;padding:3px 7px;font-size:11px}.task-state.success{background:#e3f5ed;color:#17684e}.task-state.pending{background:#fff0dc;color:#915718}.summary-table .warning,#summary-error{color:#a75b18}#summary-status{margin-top:8px}.panel{margin-bottom:18px}

/* Benchmark category navigation */
[hidden]{display:none!important}.detail-filters{border-top:3px solid #1ca78d}.filter-heading,.filter-footer{display:flex;align-items:center;justify-content:space-between;gap:20px}.filter-heading h2{margin:0}.filter-heading p{margin:8px 0 20px}.filter-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:18px}.detail-filters label{display:block;font-size:13px;font-weight:600;color:#42606d}.detail-filters select{display:block;width:100%;min-width:0;margin-top:8px;font-size:14px;padding:12px;background:#f7fafb}.record-picker{margin-top:22px;padding-top:20px;border-top:1px solid #e4ecef}.record-id{font-size:12px;overflow-wrap:anywhere;margin:10px 0 0}.filter-footer{margin-top:20px;padding-top:18px;border-top:1px solid #e4ecef}.filter-footer #status{font-size:12px;color:#738891}.filter-footer .upload{color:inherit}.filter-heading .badge{white-space:nowrap}.page-nav a[href="/detail.html"]{text-underline-offset:6px}button:disabled{opacity:.5;cursor:default}@media(max-width:800px){.filter-grid{grid-template-columns:1fr}.filter-footer,.filter-heading{align-items:flex-start;flex-direction:column;gap:12px}.filter-heading p{margin-bottom:0}.filter-heading{margin-bottom:18px}.filter-footer .actions{display:flex;flex-wrap:wrap;gap:8px}}

/* Shared product navigation */
.site-nav{display:flex;align-items:center;gap:44px;background:#102d3b;padding:12px 5%;border-bottom:1px solid #ffffff20;color:white}.site-brand{display:flex;align-items:center;gap:14px;color:#e7f1f5;font-size:13px;letter-spacing:1.5px;white-space:nowrap}.site-brand:hover{text-decoration:none}.site-symbol{display:block;width:66px;height:36px;overflow:hidden;flex:none}.site-symbol img{display:block;max-width:none}.site-sections{display:flex;gap:8px}.site-sections a{color:#bad1db;padding:10px 18px;border-radius:7px}.site-sections a[aria-current]{background:#ffffff14;color:#7de3ce;font-weight:600}.site-sections a:hover{background:#ffffff10;text-decoration:none}.page-nav{gap:6px;border-bottom:1px solid #dce5e9;padding-bottom:12px}.page-nav a{padding:9px 16px;border-radius:7px;color:#657b88}.page-nav a[aria-current="page"]{background:#def4ec;color:#19735e;font-weight:600}.page-nav a:hover{text-decoration:none;background:#e7f5f1}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1ca78d;outline-offset:3px}@media(max-width:600px){.site-nav{flex-wrap:wrap;gap:10px;padding:12px 4%}.site-sections{width:100%}.site-sections a{flex:1;text-align:center}}

.trend-panel{border-top:3px solid #168b80}.trend-panel .eyebrow{color:#168b80;margin-bottom:9px}.trend-controls{display:grid;grid-template-columns:3fr 2fr 1fr 1fr;gap:14px}.trend-controls label{font-size:12px;color:#637681;min-width:0}.trend-controls select{display:block;width:100%;max-width:none;margin-top:7px}.trend-good{color:#16815f}.trend-bad{color:#b84f43}#trend-chart svg{width:100%;display:block}#trend-chart text{font-size:12px;fill:#6f8089}.trend-empty{padding:65px 20px;text-align:center;color:#6f8089}.trend-panel summary{cursor:pointer;color:#147c79;padding:12px 0}.trend-panel details{border-top:1px solid #e4ecef;margin-top:12px}@media(max-width:800px){.trend-controls{grid-template-columns:1fr 1fr}.trend-controls label:first-child{grid-column:1/-1}#trend-chart{overflow:auto}#trend-chart svg{min-width:650px}}

.trend-key{display:inline-flex;align-items:center;gap:6px;margin:0 18px 5px 0}.key-line,.key-base{display:inline-block;width:25px;border-top:3px solid #376f83}.key-base{border-top:2px dashed #b97929}.trend-event{display:inline-block;padding:7px 10px;border-radius:6px;margin:0 8px 8px 0;font-size:12px}.trend-event.positive{background:#e5f5ee;color:#146c52}.trend-event.negative{background:#fff0ee;color:#af423a}#trend-chart .trend-annotation{font-size:13px;font-weight:650}

#trend-chart{position:relative}.trend-tooltip{position:absolute;z-index:5;pointer-events:none;white-space:pre-line;background:#153442;color:#fff;padding:12px 15px;border-radius:8px;box-shadow:0 5px 20px #102d3b30;font-size:12px;line-height:1.9;max-width:min(340px,100%)}.trend-hit{cursor:crosshair}.trend-hit:focus{outline:none;stroke:#168b80;stroke-width:2}

.trend-hit{transition:fill .15s,stroke .15s,stroke-width .15s}.trend-hit.is-selected,.trend-hit:focus{fill:transparent;stroke:none;filter:none}.trend-selection{transition:opacity .15s}

.trend-controls{grid-template-columns:2fr 1fr 2fr}.trend-controls label:first-child{grid-column:auto}@media(max-width:800px){.trend-controls{grid-template-columns:1fr 1fr}.trend-controls label:first-child{grid-column:1/-1}}@media(max-width:480px){.trend-controls{grid-template-columns:1fr}.trend-controls label:first-child{grid-column:auto}}

.daily-status-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.daily-status-card{background:#f3f7f9;border:1px solid #e1eaee;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;color:#405b68}
.daily-status-card strong{font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.daily-status-card.success{color:#087c61;background:#edf8f4}.daily-status-card.failure{color:#b63f39;background:#fff2f0}.daily-status-card.blocked{color:#966019;background:#fff8ec}.daily-status-card.running{color:#276a9b;background:#eef6fc}
#daily-status-extra:empty{display:none}@media(max-width:640px){.daily-status-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.daily-status-card:first-child{grid-column:1/-1}}

<main>
<section class="hero"><canvas id="wave" aria-hidden="true"></canvas><div class="hero-copy"><h1>Playground<span>.</span></h1><p>在麒麟真机上运行 MindSpore Lite 模型</p></div>
<div class="deployment"><label for="phone">手机类型<select id="phone"><option selected value="mate80-pro">Mate 80 Pro（kirin9030）</option><option value="mate70-pro">Mate 70 Pro（kirin9202）</option></select></label><label for="models">部署模型<select id="models" disabled><option value="">正在加载模型…</option></select></label></div>
</section>
<div class="status"><span id="connection" role="status"></span><button id="retry" hidden>重新加载</button></div>
<section class="studio"><nav id="modes" aria-label="体验方式"><button data-mode="chat" aria-pressed="true"><b aria-hidden="true">◌</b>模型对话</button><button data-mode="api" aria-pressed="false"><b aria-hidden="true">⌘</b>API 调用</button><button data-mode="device" aria-pressed="false"><b aria-hidden="true">▯</b>真机 App</button></nav>
<div id="chat"><div class="chat-head"><h2>模型对话</h2><button id="clear">清空对话</button></div>
<div id="empty"><p>选择一个问题开始，或写下自己的提示词。</p><div class="ideas"><button data-prompt="用一个生活中的例子解释 KV Cache。"><span>解释概念</span>用一个例子解释 KV Cache <em>↗</em></button><button data-prompt="用 Python 写一个简单的 LRU 缓存。"><span>编写代码</span>用 Python 实现 LRU 缓存 <em>↗</em></button></div></div>
<div id="history" aria-live="polite"></div>
<form id="compose"><textarea id="prompt" aria-label="消息" placeholder="给模型发送消息…" required></textarea><div class="compose-foot"><span>⌘ / Ctrl + Enter 发送</span><button id="send" disabled>发送 <b aria-hidden="true">↑</b></button></div></form></div>
<div id="api" hidden><div class="chat-head"><h2>API 调用</h2></div><div class="terminal"><div><strong>POST</strong> /v1/chat/completions <button id="copy">复制命令</button></div><pre id="sample"></pre></div></div>
<div id="device" hidden><div class="chat-head"><h2>真机 App</h2><div><button id="start" disabled>进入真机</button><button id="end" hidden>释放设备</button></div></div><div class="screen-stage"><div id="standby"><i aria-hidden="true"></i><strong>等待投屏</strong><p>进入真机后，点击和拖动画面即可操作手机。</p></div><img id="screen" alt="真机实时截图" draggable="false" hidden></div><p id="screenState" role="status"></p></div>
<p id="feedback" role="status"></p></section></main><script>const $ = id => document.getElementById(id);
const preview = document.body.hasAttribute('data-preview');

function drawWave() {
  const canvas = $('wave');
  const {width, height} = canvas.getBoundingClientRect();
  if (!width || !height) return;
  const density = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = width * density;
  canvas.height = height * density;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  ctx.scale(density, density);
  const color = ctx.createLinearGradient(0, 0, width, height);
  color.addColorStop(0, '#529e9d');
  color.addColorStop(.52, '#baf8dc');
  color.addColorStop(1, '#64d4c7');
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  for (let row = 0; row < 63; row++) {
    const v = row / 62;
    ctx.beginPath();
    for (let col = 0; col <= 180; col++) {
      const u = col / 180;
      const y = .49 + .27 * Math.sin(u * 6.9 + v * 2.1)
        + (v - .5) * (.5 + .45 * Math.cos(u * 7.2)) - .13 * u;
      if (col === 0) ctx.moveTo(0, y * height);
      else ctx.lineTo(u * width, y * height);
    }
    ctx.globalAlpha = .35 + .45 * Math.sin(Math.PI * v);
    ctx.stroke();
  }
}
new ResizeObserver(drawWave).observe($('wave'));
for (const button of document.querySelectorAll('[data-prompt]')) {
  button.onclick = () => {
    $('prompt').value = button.dataset.prompt;
    $('prompt').focus();
  };
}
$('prompt').onkeydown = event => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && !event.isComposing) {
    event.preventDefault();
    if (!$('send').disabled) $('compose').requestSubmit();
  }
};
let session = '', messages = [], busy = false, from = null;
let activeMode = 'chat', online = false, startingScreen = false;
$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('sample').textContent);
    $('feedback').textContent = '命令已复制。';
  } catch { $('feedback').textContent = '请选中示例并复制。'; }
};
async function request(path, body, lease) {
  const headers = {'X-Phone-Type': $('phone').value};
  if (lease) headers['X-Device-Session'] = lease;
  if (body) headers['Content-Type'] = 'application/json';
  const response = await fetch(path, {
    method: body ? 'POST' : 'GET', headers, body: body && JSON.stringify(body),
    cache: 'no-store', redirect: 'error'
  });
  if (!response.headers.get('content-type')?.includes('application/json'))
    throw Error('当前站点尚未接入 dog 网关。');
  const result = await response.json();
  if (!response.ok) throw Error(result.error?.message || '请求失败，请重新连接。');
  return result;
}
function controls() {
  $('phone').disabled = busy || !!session || startingScreen;
  $('send').disabled = busy || !online || preview;
  $('clear').disabled = busy;
  $('start').disabled = busy || !online || !!session || preview;
  $('models').disabled = !online || busy;
}
function sample() {
  const body = {model: $('models').disabled ? '<model-id>' : $('models').value,
    messages: [{role: 'user', content: '你好'}], max_tokens: 128};
  $('sample').textContent = 'curl ' + (preview ? '"$MSLITE_BASE_URL"' : location.origin) + '/v1/chat/completions \\\n  -H "X-Phone-Type: ' + $('phone').value + '" \\\n  -H "Content-Type: application/json" \\\n  --data-binary @- <<\'JSON\'\n' + JSON.stringify(body, null, 2) + '\nJSON';
}
function reset() {
  messages = [];
  $('history').replaceChildren();
  $('empty').hidden = false;
}
function line(role, content) {
  const block = document.createElement('article'), name = document.createElement('strong');
  name.textContent = role;
  block.append(name, document.createTextNode(content));
  $('history').append(block);
  block.scrollIntoView({block:'nearest'});
}
async function loadModels() {
  $('retry').hidden = true;
  busy = true; controls();
  $('connection').textContent = '正在获取部署模型…';
  try {
    const {data} = preview
      ? {data: [{id:'Qwen3-4B'}, {id:'Qwen3-0.6B'}]}
      : await request('/v1/models');
    if (!Array.isArray(data) || !data.length) throw Error('服务未登记模型。');
    $('models').replaceChildren(...data.map(m => new Option(m.id, m.id)));
    online = true;
    $('connection').textContent = preview ? '离线预览 · 示例模型，未连接真机' : '';
    reset();
  } catch (e) {
    online = false;
    $('models').replaceChildren(new Option('暂无可用模型', ''));
    $('connection').textContent = e.message;
    $('retry').hidden = false;
  } finally { busy = false; controls(); sample(); }
}
$('retry').onclick = loadModels;
$('phone').onchange = () => {
  online = false;
  reset();
  $('feedback').textContent = '';
  $('screenState').textContent = '';
  $('models').replaceChildren(new Option('正在加载模型…', ''));
  loadModels();
};
$('compose').onsubmit = async event => {
  event.preventDefault();
  const content = $('prompt').value.trim();
  if (!content || busy || !online || preview) return;
  const next = [...messages, {role:'user', content}];
  const model = $('models').value;
  busy = true; controls(); $('feedback').textContent = '等待真机生成…';
  try {
    const result = await request('/v1/chat/completions', {model, messages:next,max_tokens:128});
    const answer = result.choices[0].message;
    if (!messages.length) $('history').replaceChildren();
    messages = [...next, answer];
    $('empty').hidden = true;
    line('你', content); line(model, answer.content);
    if ($('prompt').value.trim() === content) $('prompt').value = '';
    $('feedback').textContent = '';
  } catch (e) { $('feedback').textContent = e.message; }
  finally { busy = false; controls(); }
};
$('models').onchange = () => {reset(); sample();};
$('clear').onclick = reset;
function forget() {
  $('standby').hidden = false;
  session = ''; from = null; $('screen').hidden = true; $('screen').removeAttribute('src');
  $('end').hidden = true; controls();
}
async function release() {
  const lease = session;
  forget();
  try { if (lease) await request('/device/end', {}, lease); $('screenState').textContent = ''; }
  catch (e) { $('screenState').textContent = e.message; }
}
async function frames(lease) {
  try {
    while (lease === session) {
      const frame = await request('/device/frame', {}, lease);
      if (lease !== session) return;
      $('screen').src = 'data:image/png;base64,' + frame.png;
      $('standby').hidden = true;
      $('screen').hidden = false; $('screenState').textContent = '';
      await new Promise(resolve => setTimeout(resolve, 900));
    }
  } catch (e) {
    if (lease === session) { await release(); $('screenState').textContent = e.message; }
  }
}
$('start').onclick = async () => {
  startingScreen = true; controls();
  $('start').disabled = true; $('screenState').textContent = '正在打开 App…';
  try {
    session = (await request('/device/start', {})).session;
    if (activeMode !== 'device') { await release(); return; }
    controls(); $('end').hidden = false; frames(session);
  } catch (e) { $('screenState').textContent = e.message; }
  finally { startingScreen = false; controls(); }
};
$('end').onclick = release;
const screen = $('screen');
function point(e) {
  const r = screen.getBoundingClientRect();
  return [Math.max(0, Math.min(screen.naturalWidth-1, Math.floor((e.clientX-r.left)*screen.naturalWidth/r.width))),
          Math.max(0, Math.min(screen.naturalHeight-1, Math.floor((e.clientY-r.top)*screen.naturalHeight/r.height)))];
}
screen.onpointerdown = e => {
  if (!session || !screen.naturalWidth || !e.isPrimary || e.button !== 0) return;
  from = point(e); screen.setPointerCapture(e.pointerId);
};
screen.onpointercancel = () => { from = null; };
screen.onpointerup = async e => {
  if (!from || !session || !e.isPrimary) return;
  const to = point(e), swipe = Math.hypot(to[0]-from[0], to[1]-from[1]) > 12;
  const body = {gesture:swipe?'swipe':'click',points:swipe?[...from,...to]:to};
  from = null;
  try { await request('/device/input', body, session); }
  catch (error) { $('screenState').textContent = error.message; }
};
for (const button of $('modes').querySelectorAll('button')) button.onclick = () => {
  activeMode = button.dataset.mode;
  for (const item of $('modes').querySelectorAll('button')) {
    const selected = item.dataset.mode === activeMode;
    $(item.dataset.mode).hidden = !selected;
    item.setAttribute('aria-pressed', selected);
  }
  if (session && activeMode !== 'device') release();
};
sample();
loadModels();
</script></body></html>
