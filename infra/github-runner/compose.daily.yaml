services:
  runner:
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${DAILY_ARCHIVE_DIR:?Set daily archive directory}:/data
      - ${DAILY_CONFIG_FILE:?Set daily config file}:/config/daily.json:ro
      - ${BINRUNNER_DIR:?Set BinRunner source directory}:/assets/binrunner:ro
      - ${OHOS_NATIVE_DIR:?Set OHOS native toolchain directory}:/assets/native:ro
      - ${MODEL_ARCHIVE_DIR:?Set archived model directory}:/assets/model:ro
      - ${DAILY_CONFIG_DIR:?Set daily task config directory}:/config/tasks:ro
      - ${QWEN3_4B_ARCHIVE_DIR:?Set Qwen3 4B archive directory}:/assets/qwen3-4b:ro
      - ${QWEN3_06B_ARCHIVE_DIR:?Set Qwen3 0.6B archive directory}:/assets/qwen3-06b:ro
      - ${LLAMA_ARCHIVE_DIR:?Set llama archive directory}:/assets/llama:ro
      - ${SOURCE_MODELS_DIR:?Set source HF models directory}:/assets/source-models:ro
      - ${DDK_PACKAGES_DIR:?Set original DDK packages directory}:/assets/ddk-packages:ro
