services:
  dashboard:
    build:
      context: .
      args:
        BASE_IMAGE: ${DASHBOARD_BASE_IMAGE:-python:3.11-slim}
    image: msllm-dev-ci-dashboard:local
    container_name: edge-slm-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    volumes:
      - ./data:/data:ro
      - ./auth-config:/run/auth:ro
    environment:
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:?Set HTTPS dashboard origin}
      GITCODE_CLIENT_ID: ${GITCODE_CLIENT_ID:?Set GitCode OAuth client ID}
      GITCODE_SCOPE: ${GITCODE_SCOPE:-}
      GITCODE_CLIENT_SECRET_FILE: /run/auth/client_secret
      GITCODE_ALLOWLIST_FILE: /run/auth/allowlist.json
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
