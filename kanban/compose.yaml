services:
  kanban:
    build:
      context: .
      args:
        BASE_IMAGE: ${KANBAN_BASE_IMAGE:-python:3.11-slim}
    image: msl-kanban:local
    container_name: msl-kanban
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    volumes:
      - ./data:/kanban/data:ro
      - ./jobs:/kanban/jobs:ro
      - ./operator-data:/kanban/operator-data:ro
    environment:
      DATA_DIR: /kanban/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
